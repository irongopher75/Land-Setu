state: "Delhi"
source_format: "DL_Bhulekh_v2"
default_department_sources:
  ror: "delhi_revenue_dept"
  registration: "sub_registrar_delhi"
  zoning: "dda_master_plan_2021"
  building_permit: "mcd_building_department"
  tax: "mcd_property_tax"
  encumbrance: "sub_registrar_delhi"

field_mappings:
  - source_field: "khatedar_full_name"
    target: "layers.ror.owner_name"
  - source_field: "khatoni_no"
    target: "layers.ror.khata_no"
  - source_field: "plot_area_sqm"
    target: "area_sqm"
  - source_field: "share_fraction"
    target: "layers.ror.owner_share"
  - source_field: "sale_deed_no"
    target: "layers.registration.last_transaction_id"
  - source_field: "execution_date"
    target: "layers.registration.date"
  - source_field: "transferee_name"
    target: "layers.registration.buyer_name"
  - source_field: "masterplan_use"
    target: "layers.zoning.land_use"
  - source_field: "far_permissible"
    target: "layers.zoning.permitted_fsi"
  - source_field: "sanction_file_no"
    target: "layers.building_permit.permit_id"
  - source_field: "sanction_status"
    target: "layers.building_permit.status"
  - source_field: "sanctioned_far"
    target: "layers.building_permit.approved_fsi"
  - source_field: "unit_area_tax"
    target: "layers.tax.annual_value"
  - source_field: "upic_tax_year"
    target: "layers.tax.last_verified"
  - source_field: "mortgage_flag"
    target: "layers.encumbrance.active"

terminology_map:
  "khatoni": "record_of_rights"
  "khasra": "parcel_id"
  "far": "floor_area_ratio"
