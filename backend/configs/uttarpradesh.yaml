state: "UttarPradesh"
source_format: "UP_Bhulekh_v3"
default_department_sources:
  ror: "up_bhulekh_board_of_revenue"
  registration: "sub_registrar_lucknow"
  zoning: "lda_master_plan"
  building_permit: "lmc_building_cell"
  tax: "lmc_property_tax"
  encumbrance: "sub_registrar"

field_mappings:
  - source_field: "khatedar_name"
    target: "layers.ror.owner_name"
  - source_field: "khata_number"
    target: "layers.ror.khata_no"
  - source_field: "extent_hectares"
    target: "area_sqm"
    unit_conversion: "hectares_to_sqm"
  - source_field: "share_fraction"
    target: "layers.ror.owner_share"
  - source_field: "registry_number"
    target: "layers.registration.last_transaction_id"
  - source_field: "registry_date"
    target: "layers.registration.date"
  - source_field: "purchaser_name"
    target: "layers.registration.buyer_name"
  - source_field: "land_use_category"
    target: "layers.zoning.land_use"
  - source_field: "permitted_fsi"
    target: "layers.zoning.permitted_fsi"
  - source_field: "map_sanction_no"
    target: "layers.building_permit.permit_id"
  - source_field: "sanction_status"
    target: "layers.building_permit.status"
  - source_field: "approved_fsi"
    target: "layers.building_permit.approved_fsi"
  - source_field: "house_tax_valuation"
    target: "layers.tax.annual_value"
  - source_field: "tax_assessment_date"
    target: "layers.tax.last_verified"
  - source_field: "bank_mortgage_active"
    target: "layers.encumbrance.active"

terminology_map:
  "khatauni": "record_of_rights"
  "khasra": "plot_identifier"
