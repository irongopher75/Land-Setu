state: "WestBengal"
source_format: "WB_Banglarbhumi_v3"
default_department_sources:
  ror: "banglarbhumi_lrbldo"
  registration: "sub_registrar_kolkata"
  zoning: "kmda_master_plan"
  building_permit: "kmc_building_dept"
  tax: "kmc_property_tax"
  encumbrance: "registration_dept"

field_mappings:
  - source_field: "raiyat_name"
    target: "layers.ror.owner_name"
  - source_field: "khatian_no"
    target: "layers.ror.khata_no"
  - source_field: "area_acres"
    target: "area_sqm"
    unit_conversion: "hectares_to_sqm"
  - source_field: "share_portion"
    target: "layers.ror.owner_share"
  - source_field: "deed_reg_no"
    target: "layers.registration.last_transaction_id"
  - source_field: "deed_date"
    target: "layers.registration.date"
  - source_field: "purchaser_full_name"
    target: "layers.registration.buyer_name"
  - source_field: "land_classification"
    target: "layers.zoning.land_use"
  - source_field: "fsi_permitted"
    target: "layers.zoning.permitted_fsi"
  - source_field: "building_plan_no"
    target: "layers.building_permit.permit_id"
  - source_field: "plan_status"
    target: "layers.building_permit.status"
  - source_field: "approved_fsi"
    target: "layers.building_permit.approved_fsi"
  - source_field: "tax_valuation"
    target: "layers.tax.annual_value"
  - source_field: "tax_clearance_year"
    target: "layers.tax.last_verified"
  - source_field: "mortgage_active"
    target: "layers.encumbrance.active"

terminology_map:
  "khatian": "record_of_rights"
  "dag": "plot_identifier"
  "mutated": "ownership_transferred"

# Localised role titles shown by the UI for this state (docs/rbac-migration-plan.md Phase 2).
# The backend always authorizes against the canonical role name on the left; this block is display-only.
role_titles_verified: false
role_titles:
  village_officer: "Village Officer"
  surveyor: "Surveyor"
  revenue_inspector: "Revenue Inspector"
  tehsildar: "Tehsildar"
  naib_tehsildar: "Naib Tehsildar"
  sdo: "Sdo"
  district_collector: "District Collector"
  additional_collector: "Additional Collector"
  sub_registrar: "Sub Registrar"
  state_land_records_admin: "State Land Records Admin"
  state_auditor: "State Auditor"
  national_viewer: "National Viewer"
  system_admin: "System Admin"
  citizen: "Citizen"
