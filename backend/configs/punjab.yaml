state: "Punjab"
source_format: "PB_Jamabandi_v1"
default_department_sources:
  ror: "revenue_department_pb"
  registration: "tehsildar_sub_registrar"
  zoning: "puDA_development_authority"
  building_permit: "municipal_corporation_pb"
  tax: "property_tax_dept_pb"
  encumbrance: "tehsildar_sub_registrar"

field_mappings:
  - source_field: "malik_naam"
    target: "layers.ror.owner_name"
  - source_field: "khewat_no"
    target: "layers.ror.khata_no"
  - source_field: "raqba_marla"
    target: "area_sqm"
    unit_conversion: "marla_to_sqm"
  - source_field: "hissa_share"
    target: "layers.ror.owner_share"
  - source_field: "wasika_no"
    target: "layers.registration.last_transaction_id"
  - source_field: "wasika_date"
    target: "layers.registration.date"
  - source_field: "khasra_use"
    target: "layers.zoning.land_use"
  - source_field: "manzoor_far"
    target: "layers.zoning.permitted_fsi"
  - source_field: "naksha_pass_no"
    target: "layers.building_permit.permit_id"
  - source_field: "naksha_status"
    target: "layers.building_permit.status"
  - source_field: "naksha_far"
    target: "layers.building_permit.approved_fsi"
  - source_field: "property_tax_rs"
    target: "layers.tax.annual_value"
  - source_field: "tax_aakhri_saal"
    target: "layers.tax.last_verified"
  - source_field: "rehn_rahan_flag"
    target: "layers.encumbrance.active"

terminology_map:
  "jamabandi": "record_of_rights"
  "wasika": "sale_deed"
  "inteqal": "mutation"

# Localised role titles shown by the UI for this state (docs/rbac-migration-plan.md Phase 2).
# The backend always authorizes against the canonical role name on the left; this block is display-only.
role_titles_verified: true
role_titles:
  village_officer: "Patwari"
  surveyor: "Surveyor"
  revenue_inspector: "Kanungo"
  tehsildar: "Tehsildar"
  naib_tehsildar: "Naib Tehsildar"
  sdo: "SDM"
  district_collector: "Deputy Commissioner"
  additional_collector: "ADC"
  sub_registrar: "Sub-Registrar"
  state_land_records_admin: "Director Land Records"
  state_auditor: "State Auditor"
  national_viewer: "National Viewer"
  system_admin: "System Admin"
  citizen: "Citizen"
