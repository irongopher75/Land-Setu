state: "Karnataka"
source_format: "KA_Bhoomi_v4"
default_department_sources:
  ror: "bhoomi_revenue_dept"
  registration: "kaverigate_sub_registrar"
  zoning: "bbmp_master_plan"
  building_permit: "bbmp_building_cell"
  tax: "sas_property_tax"
  encumbrance: "kaveri_registry"

field_mappings:
  - source_field: "owner_kannada_eng"
    target: "layers.ror.owner_name"
  - source_field: "rtc_khata_no"
    target: "layers.ror.khata_no"
  - source_field: "extent_sqm"
    target: "area_sqm"
  - source_field: "joint_owner_share"
    target: "layers.ror.owner_share"
  - source_field: "kaveri_doc_no"
    target: "layers.registration.last_transaction_id"
  - source_field: "reg_timestamp"
    target: "layers.registration.date"
  - source_field: "buyer_name"
    target: "layers.registration.buyer_name"
  - source_field: "zoning_classification"
    target: "layers.zoning.land_use"
  - source_field: "fsi_limit"
    target: "layers.zoning.permitted_fsi"
  - source_field: "plan_approval_no"
    target: "layers.building_permit.permit_id"
  - source_field: "occupancy_cert_status"
    target: "layers.building_permit.status"
  - source_field: "approved_fsi"
    target: "layers.building_permit.approved_fsi"
  - source_field: "annual_tax_dues"
    target: "layers.tax.annual_value"
  - source_field: "tax_paid_date"
    target: "layers.tax.last_verified"
  - source_field: "bank_lien_active"
    target: "layers.encumbrance.active"

terminology_map:
  "rtc": "record_of_rights"
  "mutation_register": "mutation_record"
  "bhoomi": "land_governance_system"
