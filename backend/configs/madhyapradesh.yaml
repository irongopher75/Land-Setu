state: "MadhyaPradesh"
source_format: "MP_Bhulekh_v2"
default_department_sources:
  ror: "mp_bhulekh_dept"
  registration: "sub_registrar_mp"
  zoning: "tncp_mp"
  building_permit: "nagar_nigam_mp"
  tax: "sampatti_kar_cell"
  encumbrance: "sub_registrar_mp"

field_mappings:
  - source_field: "bhoomi_swami"
    target: "layers.ror.owner_name"
  - source_field: "khata_kramank"
    target: "layers.ror.khata_no"
  - source_field: "kshetrafal_hec"
    target: "area_sqm"
    unit_conversion: "hectares_to_sqm"
  - source_field: "hissa_anash"
    target: "layers.ror.owner_share"
  - source_field: "panjiyan_kramank"
    target: "layers.registration.last_transaction_id"
  - source_field: "panjiyan_tithi"
    target: "layers.registration.date"
  - source_field: "bhoomi_prayojan"
    target: "layers.zoning.land_use"
  - source_field: "maney_fsi"
    target: "layers.zoning.permitted_fsi"
  - source_field: "anumati_kramank"
    target: "layers.building_permit.permit_id"
  - source_field: "anumati_sthiti"
    target: "layers.building_permit.status"
  - source_field: "swikrit_fsi"
    target: "layers.building_permit.approved_fsi"
  - source_field: "varshik_kar"
    target: "layers.tax.annual_value"
  - source_field: "kar_bhugtan_varsh"
    target: "layers.tax.last_verified"
  - source_field: "bandhak_sthiti"
    target: "layers.encumbrance.active"

terminology_map:
  "khasra": "record_of_rights"
  "bhoomi_swami": "landowner"
  "panjiyan": "registration"
