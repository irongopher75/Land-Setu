state: "Chandigarh"
source_format: "CHD_Jamabandi_v2"
default_department_sources:
  ror: "estate_office"
  registration: "sub_registrar"
  zoning: "urban_planning_dept"
  building_permit: "estate_office_building_branch"
  tax: "municipal_corporation_tax_cell"
  encumbrance: "sub_registrar"

field_mappings:
  - source_field: "owner_full_name"
    target: "layers.ror.owner_name"
  - source_field: "record_no"
    target: "layers.ror.khata_no"
  - source_field: "area_sqyd"
    target: "area_sqm"
    unit_conversion: "sqyd_to_sqm"
  - source_field: "ownership_type"
    target: "layers.ror.owner_share"
  - source_field: "deed_number"
    target: "layers.registration.last_transaction_id"
  - source_field: "deed_date"
    target: "layers.registration.date"
  - source_field: "deed_owner"
    target: "layers.registration.buyer_name"
  - source_field: "zone_category"
    target: "layers.zoning.land_use"
  - source_field: "max_fsi"
    target: "layers.zoning.permitted_fsi"
  - source_field: "building_license_no"
    target: "layers.building_permit.permit_id"
  - source_field: "license_status"
    target: "layers.building_permit.status"
  - source_field: "approved_fsi"
    target: "layers.building_permit.approved_fsi"
  - source_field: "property_tax_value"
    target: "layers.tax.annual_value"
  - source_field: "tax_year"
    target: "layers.tax.last_verified"
  - source_field: "mortgage_status"
    target: "layers.encumbrance.active"

terminology_map:
  "jamabandi": "record_of_rights"
  "khasra": "parcel_identifier"
  "intequal": "mutation_record"
