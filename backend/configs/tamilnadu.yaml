state: "TamilNadu"
source_format: "TN_RoR_v3"
default_department_sources:
  ror: "registration_dept"
  registration: "sub_registrar"
  zoning: "master_plan_2021"
  building_permit: "municipal_corp"
  tax: "revenue_dept"
  encumbrance: "sub_registrar"

field_mappings:
  - source_field: "pattadar_peyar"
    target: "layers.ror.owner_name"
  - source_field: "khatha_num"
    target: "layers.ror.khata_no"
  - source_field: "extent_hectares"
    target: "area_sqm"
    unit_conversion: "hectares_to_sqm"
  - source_field: "patta_type"
    target: "layers.ror.patta_type"
  - source_field: "transaction_ref"
    target: "layers.registration.last_transaction_id"
  - source_field: "transaction_date"
    target: "layers.registration.date"
  - source_field: "registration_owner"
    target: "layers.registration.buyer_name"
  - source_field: "land_use_code"
    target: "layers.zoning.land_use"
  - source_field: "fsi_permitted"
    target: "layers.zoning.permitted_fsi"
  - source_field: "permit_ref"
    target: "layers.building_permit.permit_id"
  - source_field: "permit_status"
    target: "layers.building_permit.status"
  - source_field: "permit_fsi_approved"
    target: "layers.building_permit.approved_fsi"
  - source_field: "tax_annual_value"
    target: "layers.tax.annual_value"
  - source_field: "tax_last_updated"
    target: "layers.tax.last_verified"
  - source_field: "encumbrance_flag"
    target: "layers.encumbrance.active"

terminology_map:
  "patta": "record_of_rights"
  "adangal": "land_use_register"
  "chitta": "ownership_extract"

# Cross-department chain for a land transaction (app/transactions.py). See chandigarh.yaml for the keys.
transaction_workflow:
  departments:
    - department: REGISTRATION
      stages:
        - {name: "Sub-Registrar deed verification", role: officer}
    - department: REVENUE
      stages:
        - {name: "VAO field verification", role: village_officer}
        - {name: "Revenue Inspector review", role: auditor, when: ri_required}
        - {name: "Tahsildar approval", role: state_admin}
    - department: MUNICIPAL
      auto: true
      stages:
        - {name: "Property tax re-keyed to new owner", role: state_admin}
    - department: PLANNING
      when: land_use_change
      stages:
        - {name: "Town and Country Planning clearance", role: state_admin}
  dispute:
    stages:
      - {name: "RDO / District Collector hearing", role: state_admin}
