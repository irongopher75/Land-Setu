state: "Telangana"
source_format: "TS_Dharani_v1"
default_department_sources:
  ror: "dharani_portal"
  registration: "sub_registrar_hyderabad"
  zoning: "hmda_master_plan"
  building_permit: "ghmc_building_cell"
  tax: "ghmc_property_tax"
  encumbrance: "dharani_registry"

field_mappings:
  - source_field: "pattadar_name"
    target: "layers.ror.owner_name"
  - source_field: "passbook_no"
    target: "layers.ror.khata_no"
  - source_field: "extent_sqm"
    target: "area_sqm"
  - source_field: "extent_acres_guntas"
    target: "layers.ror.owner_share"
  - source_field: "dharani_doc_no"
    target: "layers.registration.last_transaction_id"
  - source_field: "registration_date"
    target: "layers.registration.date"
  - source_field: "buyer_name"
    target: "layers.registration.buyer_name"
  - source_field: "hmda_zone"
    target: "layers.zoning.land_use"
  - source_field: "permitted_fsi"
    target: "layers.zoning.permitted_fsi"
  - source_field: "bpas_permission_no"
    target: "layers.building_permit.permit_id"
  - source_field: "approval_status"
    target: "layers.building_permit.status"
  - source_field: "approved_fsi"
    target: "layers.building_permit.approved_fsi"
  - source_field: "tax_amount"
    target: "layers.tax.annual_value"
  - source_field: "tax_paid_year"
    target: "layers.tax.last_verified"
  - source_field: "lien_encumbrance"
    target: "layers.encumbrance.active"

terminology_map:
  "pattadar_passbook": "record_of_rights"
  "dharani": "integrated_land_records"
