state: "Kerala"
source_format: "KL_Erekha_v2"
default_department_sources:
  ror: "erekha_revenue_dept"
  registration: "sub_registrar_kochi"
  zoning: "town_planning_dept"
  building_permit: "kochi_corporation"
  tax: "revenue_thandaper"
  encumbrance: "sub_registrar"

field_mappings:
  - source_field: "thandaper_holder"
    target: "layers.ror.owner_name"
  - source_field: "thandaper_no"
    target: "layers.ror.khata_no"
  - source_field: "extent_ares"
    target: "area_sqm"
    unit_conversion: "hectares_to_sqm"
  - source_field: "possession_share"
    target: "layers.ror.owner_share"
  - source_field: "adiveedam_no"
    target: "layers.registration.last_transaction_id"
  - source_field: "reg_date"
    target: "layers.registration.date"
  - source_field: "transferee"
    target: "layers.registration.buyer_name"
  - source_field: "master_plan_zone"
    target: "layers.zoning.land_use"
  - source_field: "max_fsi"
    target: "layers.zoning.permitted_fsi"
  - source_field: "permit_no"
    target: "layers.building_permit.permit_id"
  - source_field: "permit_status"
    target: "layers.building_permit.status"
  - source_field: "sanctioned_far"
    target: "layers.building_permit.approved_fsi"
  - source_field: "land_tax_amount"
    target: "layers.tax.annual_value"
  - source_field: "tax_receipt_date"
    target: "layers.tax.last_verified"
  - source_field: "encumbrance_status"
    target: "layers.encumbrance.active"

terminology_map:
  "thandaper": "record_of_rights"
  "pokkuvaravu": "mutation_record"
  "kadam": "encumbrance"
