# Administrative geography seed list for backend/scripts/load_admin_units.py.
#
# This file is the SOURCE OF TRUTH for which admin_units rows get created — editable, not hardcoded in
# Python (see docs/rbac-migration-plan.md Phase 1). It does NOT contain LGD codes or boundary polygons:
# - lgd_code stays null everywhere here. Real LGD (Local Government Directory) codes must come from an
#   export placed in data/lgd/ (see data/lgd/README expectations in the loader); none exists in this repo
#   yet, so every unit's lgd_code is null and the ltree path uses the slug instead.
# - geom stays unset here. Real boundary polygons come from data/boundaries/*.geojson, loaded by
#   scripts/load_boundaries.py. None exist in this repo yet, so every unit below state level is created
#   with geom NULL and boundary_verified: false (a deliberately unmapped placeholder) — fabricating a
#   polygon is explicitly forbidden (see docs/rbac-migration-plan.md).
#
# tier: deep   -> full hierarchy down to village, mock parcels exist (seeded by backend/app/seed.py).
# tier: shallow -> district + at least one tehsil, no mock parcels yet.
#
# slug rules: lowercase, [a-z0-9_] only (must be a valid Postgres ltree label — no hyphens).

