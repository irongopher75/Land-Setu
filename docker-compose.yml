version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: landsetu-db
    environment:
      POSTGRES_USER: landsetu
      POSTGRES_PASSWORD: landsetu_pass
      POSTGRES_DB: landsetu_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landsetu -d landsetu_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: landsetu-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://landsetu:landsetu_pass@db:5432/landsetu_db
      - JWT_SECRET=landsetu_jwt_secret_hackathon_2026
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: landsetu-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
