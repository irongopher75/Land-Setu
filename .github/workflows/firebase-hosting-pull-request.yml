name: CI & Preview Deploy on Pull Request
on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  backend_tests:
    name: Run FastAPI Backend Pytest Suite
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: landsetu
          POSTGRES_PASSWORD: landsetu_pass
          POSTGRES_DB: landsetu_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U landsetu -d landsetu_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run migrations
        env:
          DATABASE_URL: "postgresql://landsetu:landsetu_pass@localhost:5432/landsetu_db"
          PYTHONPATH: "backend"
        run: |
          cd backend && python -m alembic upgrade head
      - name: Execute Pytest Suite
        env:
          JWT_SECRET: "ci_test_secret_key_minimum_32_chars_long_for_security_test"
          DEMO_LOGIN_ENABLED: "false"
          DATABASE_URL: "postgresql://landsetu:landsetu_pass@localhost:5432/landsetu_db"
          PYTHONPATH: "backend"
        run: |
          pytest backend/tests

  frontend_build:
    name: Build React Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd frontend && npm ci && npm run build

  preview_deploy:
    name: Deploy Firebase Preview Channel
    needs: [backend_tests, frontend_build]
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd frontend && npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LANDSETU_E4E5E }}
          projectId: landsetu-e4e5e
