name: CI & Deploy to Firebase Hosting on Merge
on:
  push:
    branches:
      - main

jobs:
  backend_tests:
    name: Run FastAPI Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Execute Pytest Suite
        env:
          JWT_SECRET: "ci_test_secret_key_minimum_32_chars_long_for_security_test"
          DEMO_LOGIN_ENABLED: "false"
          ALLOW_SQLITE_FALLBACK: "true"
          PYTHONPATH: "backend"
        run: |
          pytest backend/tests

  frontend_build:
    name: Build React Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd frontend && npm ci && npm run build

  deploy_hosting:
    name: Deploy to Firebase Hosting
    needs: [backend_tests, frontend_build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd frontend && npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LANDSETU_E4E5E }}
          channelId: live
          projectId: landsetu-e4e5e
