name: CI & Deploy to Firebase Hosting on Merge
on:
  push:
    branches:
      - main

jobs:
  backend_check:
    name: Check FastAPI backend imports and compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Compile and import the API
        env:
          JWT_SECRET: "ci_build_secret_key_minimum_32_chars_long_not_used_in_production"
          DEMO_LOGIN_ENABLED: "false"
          ALLOW_SQLITE_FALLBACK: "true"
          DATABASE_URL: "sqlite:///./ci_check.db"
          PYTHONPATH: "backend"
        run: |
          python -m compileall -q backend/app
          python -c "import app.main"

  frontend_build:
    name: Build React Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd frontend && npm ci && npm run build

  deploy_hosting:
    name: Deploy to Firebase Hosting
    needs: [backend_check, frontend_build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd frontend && npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LANDSETU_E4E5E }}
          channelId: live
          projectId: landsetu-e4e5e
